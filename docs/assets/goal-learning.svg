<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">Goal Learning — learn toward something real</title>
  <desc id="description">The tutor chooses among coverage, exploration, practice, and refresh using evidence of learning.</desc>
  <rect x="1" y="1" width="1278" height="358" rx="24" fill="#F5F4EE" stroke="#DEDCD1" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="52" y="46" width="10" height="10" rx="2" fill="#237C69"/>
    <text x="74" y="57" font-size="15" font-weight="700" letter-spacing="3" fill="#41584F">GOAL LEARNING</text>
    <text x="50" y="139" font-size="59" font-weight="700" letter-spacing="-2" fill="#192E2B">Learn toward</text>
    <text x="50" y="206" font-size="59" font-weight="700" letter-spacing="-2" fill="#192E2B">something real.</text>
    <text x="53" y="259" font-size="21" fill="#52615A">A clear goal. Small steps. Evidence of progress.</text>
    <path d="M643 48V306" stroke="#DEDCD1" stroke-width="2"/>
    <g transform="translate(694 60)">
      <rect width="231" height="91" rx="13" fill="#E0ECE3"/>
      <text x="20" y="34" font-size="13" font-weight="700" letter-spacing="2" fill="#315D4D">01 / COVER</text>
      <text x="20" y="65" font-size="21" fill="#192E2B">Required material</text>
      <rect x="247" width="231" height="91" rx="13" fill="#DFE8F2"/>
      <text x="267" y="34" font-size="13" font-weight="700" letter-spacing="2" fill="#345B7C">02 / EXPLORE</text>
      <text x="267" y="65" font-size="21" fill="#192E2B">Uncertain knowledge</text>
      <rect y="107" width="231" height="91" rx="13" fill="#F0E0D2"/>
      <text x="20" y="141" font-size="13" font-weight="700" letter-spacing="2" fill="#875632">03 / PRACTICE</text>
      <text x="20" y="172" font-size="21" fill="#192E2B">Known weaknesses</text>
      <rect x="247" y="107" width="231" height="91" rx="13" fill="#E9E3F1"/>
      <text x="267" y="141" font-size="13" font-weight="700" letter-spacing="2" fill="#665179">04 / REFRESH</text>
      <text x="267" y="172" font-size="21" fill="#192E2B">Apparently strong</text>
      <text x="0" y="242" font-size="17" fill="#52615A">The next step follows the evidence.</text>
    </g>
  </g>
</svg>
